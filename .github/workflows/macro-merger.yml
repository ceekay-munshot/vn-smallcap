name: Macro refresh merger (routine output → context)

# Triggers when the weekly macro-indicators-refresh Claude.ai routine pushes
# a new public/data/weekly-macro-refresh.json (via PR-merge to main).
# Validates each indicator against sanity bounds and merges accepted values
# into screener-test/static/macro-context.json. The next daily-refresh's
# scrape-macro.mjs picks up the new context values and writes them to
# public/data/macro.json which the dashboard reads.
#
# Indicators outside their sanity range or from sources older than 120 days
# are rejected — the existing value is preserved instead of being overwritten
# with bad data.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/data/weekly-macro-refresh.json'

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run macro refresh merger
        run: node screener-test/merge-macro-refresh.mjs

      - name: Commit merged macro-context.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screener-test/static/macro-context.json
          if git diff --cached --quiet; then
            echo "No macro context changes after merge."
            exit 0
          fi
          git commit -m "Auto-merge routine macro refresh ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto fresh main..."
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed — aborting."; git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          echo "Push still failing after 4 attempts."
          exit 1
