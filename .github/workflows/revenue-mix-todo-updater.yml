name: Revenue-mix to-do list updater

# Regenerates public/data/revenue-mix-todo.csv based on:
#   - current universe (screener-companies.json)
#   - existing extractions + their freshness (company-revenue-mix.json)
#   - SPIP composite ranking (computed inline from screener + tech + macro)
#
# Priority order keeps SPIP STRONG BUY → BUY → other NEW → STALE at the
# top of the CSV. The daily Claude.ai routine reads the top 10 rows each
# morning — new IPOs added to the universe overnight automatically float
# to the top of their tier on the next regen.

on:
  schedule:
    # 01:45 UTC == 07:15 IST every day — after daily-refresh (00:23 UTC)
    # completes, after auditor-todo-updater (01:30 UTC) finishes, so the
    # macro / fundamentals / tech / auditor data are all fresh before we
    # score composite + write the TODO.
    - cron: "45 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/data/screener-companies.json'
      - 'public/data/company-revenue-mix.json'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build revenue-mix TODO
        run: node screener-test/build-revenue-mix-todo.mjs

      - name: Commit refreshed TODO
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/revenue-mix-todo.csv
          if git diff --cached --quiet; then
            echo "Revenue-mix TODO unchanged."
            exit 0
          fi
          git commit -m "Refresh revenue-mix TODO ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1
