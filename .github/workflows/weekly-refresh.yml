name: Weekly refresh (fundamentals)

# Fundamentals (Screener.in via Playwright) run once a week on Sunday
# night IST. Reason for the weekly cadence: Screener.in fundamentals
# (P&L ratios, shareholding) are quarterly/annual numbers that simply
# don't move day-to-day — daily scraping burned ~50 min of CI a day
# for stale data.
#
# Governance flags live in daily-refresh (the news-driven sources need
# daily cadence to surface high-profile SEBI announcements within 24h
# instead of waiting for Sunday).
#
# Schedule rationale:
# - Sunday 21:23 UTC == Monday 02:53 IST. Deliberately staggered ~3h
#   AFTER the klpdash large-cap repo's Sunday 18:23 UTC run so the two
#   dashboards never hit Screener.in concurrently.
# - Still lands before Monday's daily-refresh (05:53 IST), so Monday
#   picks up week-fresh fundamentals immediately.
# - Off the :00/:15/:30/:45 boundaries to dodge GitHub's cron queue
#   contention windows.
#
# Runtime budget: the 10-company smoke test showed ~1.9s per company but
# ~35s for the ~20% that hit "(only 0 ratios; retrying)" -- the Screener
# page occasionally renders with no #top-ratios block at all and needs a
# reload. At that mix, 724 companies is ~104 min of scraping plus ~5 min
# of setup. Timeout is 300 min so a worse-than-sampled retry rate cannot
# kill the run; if it ever does time out, resume with the start_at input.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Screener saved-screen URL"
        required: true
        type: string
        default: "https://www.screener.in/screens/3836355/vipulscreen/"
      max_companies:
        description: "How many companies to scrape (0 = all)"
        required: false
        type: string
        default: "0"
      max_pages:
        description: "Safety cap on screen pages to read"
        required: false
        type: string
        default: "40"
      start_at:
        description: "Resume index for fundamentals (0 = start from the first company)"
        required: false
        type: string
        default: "0"
  schedule:
    - cron: "19 21 * * 0"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies (Playwright + cheerio)
        run: |
          npm install playwright@1 cheerio@1 --no-save
          npx playwright install --with-deps chromium

      # ---- 1. Fundamentals (Screener.in) — the slow one (~50 min) ----
      - name: Run fundamentals scraper
        env:
          SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
          SCREEN_URL: ${{ inputs.url || 'https://www.screener.in/screens/3836355/vipulscreen/' }}
          MAX_COMPANIES: ${{ inputs.max_companies || '0' }}
          MAX_PAGES: ${{ inputs.max_pages || '40' }}
          START_AT: ${{ inputs.start_at || '0' }}
        run: node screener-test/scrape.mjs

      - name: Sync fundamentals into public/data
        run: |
          mkdir -p public/data
          cp screener-test/output/screener-companies.csv public/data/
          cp screener-test/output/screener-companies.json public/data/
          cp screener-test/output/metadata.json public/data/

      # ---- 2. Pin cohort members that just left the band ----
      # MUST run here: after the new universe is in place but BEFORE it is
      # committed. Right now the working tree has the new universe and git
      # HEAD still has the previous one -- and HEAD is the only place a
      # just-departed company's fundamentals row still exists. Move this
      # step after the commit and that row is gone permanently, leaving the
      # position untracked for the rest of its hold.
      - name: Pin departed cohort holdings
        run: node screener-test/pin-holdings.mjs

      # ---- Artifacts ----
      - name: Upload weekly artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: weekly-refresh-data
          path: |
            public/data/screener-companies.csv
            public/data/screener-companies.json
            public/data/metadata.json
            public/data/pinned-companies.json
          if-no-files-found: warn

      # ---- One commit, one push ----
      - name: Commit refreshed data to main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/screener-companies.csv public/data/screener-companies.json public/data/metadata.json
          [ -f public/data/pinned-companies.json ] && git add public/data/pinned-companies.json || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Weekly refresh ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — fetching + rebasing onto fresh main..."
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed — aborting."; git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          echo "Push still failing after 4 attempts."
          exit 1
