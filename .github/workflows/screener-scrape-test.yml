name: Screener scrape test

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Screener saved-screen URL"
        required: true
        type: string
        default: "https://www.screener.in/screens/3675531/fundareal-klp-final/"
      max_companies:
        description: "How many companies to scrape (0 = all). Use a small number for a quick test."
        required: false
        type: string
        default: "0"
      max_pages:
        description: "Safety cap on screen pages to read"
        required: false
        type: string
        default: "30"
      start_at:
        description: "Resume index (0 = start from the first company). Use this with max_companies to continue a previous run."
        required: false
        type: string
        default: "0"
  # Scheduled runs live in daily-refresh.yml. This workflow is now
  # workflow_dispatch-only — kept for manual single-scraper reruns
  # (e.g. resuming a partial fundamentals scrape via start_at).

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          npm install playwright@1 cheerio@1 --no-save
          npx playwright install --with-deps chromium

      - name: Run scraper
        env:
          SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
          SCREEN_URL: ${{ inputs.url || 'https://www.screener.in/screens/3675531/fundareal-klp-final/' }}
          MAX_COMPANIES: ${{ inputs.max_companies || '0' }}
          MAX_PAGES: ${{ inputs.max_pages || '30' }}
          START_AT: ${{ inputs.start_at || '0' }}
        run: node screener-test/scrape.mjs

      - name: Upload scraped data
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screener-data
          path: screener-test/output/
          if-no-files-found: warn

      - name: Sync fresh data into public/
        if: success() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p public/data
          cp screener-test/output/screener-companies.csv public/data/
          cp screener-test/output/screener-companies.json public/data/
          cp screener-test/output/metadata.json public/data/

      - name: Commit refreshed data to main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/screener-companies.csv public/data/screener-companies.json public/data/metadata.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Daily data refresh ($(date -u +%Y-%m-%d))"
          # Handle push race — another scrape workflow may have committed
          # to main while we were running. Fetch + rebase + retry.
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — fetching + rebasing onto fresh main..."
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed — aborting."; git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          echo "Push still failing after 4 attempts."
          exit 1
