name: Screener scrape test

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Screener saved-screen URL"
        required: true
        type: string
        default: "https://www.screener.in/screens/3836355/vipulscreen/"
      max_companies:
        description: "How many companies to scrape (0 = all). Use a small number for a quick test."
        required: false
        type: string
        default: "0"
      max_pages:
        description: "Safety cap on screen pages to read"
        required: false
        type: string
        default: "40"
      start_at:
        description: "Resume index (0 = start from the first company). Use this with max_companies to continue a previous run."
        required: false
        type: string
        default: "0"
  # Scheduled runs live in daily-refresh.yml. This workflow is now
  # workflow_dispatch-only — kept for manual single-scraper reruns
  # (e.g. resuming a partial fundamentals scrape via start_at).

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          npm install playwright@1 cheerio@1 --no-save
          npx playwright install --with-deps chromium

      - name: Run scraper
        env:
          SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
          SCREEN_URL: ${{ inputs.url || 'https://www.screener.in/screens/3836355/vipulscreen/' }}
          MAX_COMPANIES: ${{ inputs.max_companies || '0' }}
          MAX_PAGES: ${{ inputs.max_pages || '40' }}
          START_AT: ${{ inputs.start_at || '0' }}
        run: node screener-test/scrape.mjs

      - name: Upload scraped data
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screener-data
          path: screener-test/output/
          if-no-files-found: warn

      # NO commit step, deliberately. This workflow exists to smoke-test
      # login + the ribbon on a handful of companies. It used to sync and
      # push to main, which meant a 10-company test run would overwrite the
      # real 724-company universe file and the next technicals run would
      # score 10 stocks. Results are in the artifact above; the full run
      # lives in weekly-refresh.yml.
