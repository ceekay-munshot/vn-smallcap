name: Daily refresh (all scrapers)

# Daily scrapers that change day-to-day: Technicals, Governance flags,
# Benchmarks. (Insider trades are refreshed MANUALLY via
# insider-scrape.yml, not here.) The slow Fundamentals scrape lives in
# weekly-refresh.yml because those numbers are quarterly/annual and
# don't move daily.
#
# The Macro and Sentiment pillars are not part of this dashboard, so the
# macro / Firecrawl-sentiment / PLI-renewable scrapers were removed.
#
# Total runtime budget: ~9 min (Technicals ~5 at 724 companies,
# Governance ~3, Benchmarks <1).

on:
  workflow_dispatch:
  schedule:
    # 00:53 UTC == 06:23 IST. Staggered 30 min after the large-cap repo. Off the :00/:15/:30/:45 marks where GitHub's
    # cron scheduler queues up runs and frequently delays / skips during
    # high load.
    - cron: "11 0 * * *"   # 05:41 IST. Off the :00/:15/:30/:45 marks, where
                           # GitHub queues scheduled runs and often delays them.

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # ---- 1. Technicals (Yahoo) — ~4 min ----
      - name: Run technicals scraper
        run: node screener-test/scrape-technicals.mjs

      # ---- 2. Insider trades — MANUAL ONLY (not run here) ----
      # Insider refresh runs via .github/workflows/insider-scrape.yml (muns.io),
      # triggered by hand in 5-at-a-time batches (the `tickers` input). It is
      # intentionally NOT part of the daily auto-refresh. insider-trades.json
      # is still read below by the snapshot step; it just isn't regenerated here.

      # ---- 3. Governance flags (SEBI via Firecrawl) — ~3 min, non-fatal ----
      # News-driven so daily cadence matters: Mint / BS / ET SEBI topic
      # pages refresh daily; a high-profile SEBI announcement against a
      # universe name needs to surface within 24h, not wait for Sunday.
      # SEBI enforcement is materially more common in the small/mid-cap
      # band than in large caps, so this rule earns its keep here.
      # Curated baseline (screener-test/static/known-sebi-cases.json)
      # guarantees minimum coverage even when news sources return empty.
      - name: Run governance flags scraper
        continue-on-error: true
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: node screener-test/scrape-governance-flags.mjs

      # ---- 4. Benchmark history (Smallcap 250 / Midcap 150 / Nifty 50) ----
      # Used by the History tab to compute alpha (pick return − benchmark
      # return) over the same window as each monthly cohort. One Yahoo
      # call per index gets the full series; we overwrite the file every
      # day so it's always fresh.
      - name: Refresh benchmark history
        continue-on-error: true
        run: node screener-test/scrape-benchmarks.mjs

      # ---- 5. Daily snapshot for the History tab ----
      # Replays the composite scorer against the freshly-refreshed inputs
      # and emits public/data/snapshots/YYYY-MM-DD.json — every company's
      # composite + rating + close at end of day. The History tab uses
      # the trail of these files to compute realized return per past
      # STRONG BUY pick. Cheap (~1s), idempotent (same input → same output).
      - name: Write today's SPIP snapshot
        if: always()
        run: node screener-test/write-snapshot.mjs

      # ---- Artifacts (always upload, even on partial failure) ----
      - name: Upload all data artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: daily-refresh-data
          path: |
            public/data/technicals.json
            public/data/insider-trades.json
            public/data/atr-history.json
            public/data/governance-flags.json
            public/data/benchmark-history.json
            public/data/snapshots/index.json
          if-no-files-found: warn

      # ---- One commit, one push ----
      - name: Commit refreshed data to main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/technicals.json
          [ -f public/data/insider-trades.json ] && git add public/data/insider-trades.json || true
          [ -f public/data/atr-history.json ] && git add public/data/atr-history.json || true
          [ -f public/data/governance-flags.json ] && git add public/data/governance-flags.json || true
          [ -f public/data/benchmark-history.json ] && git add public/data/benchmark-history.json || true
          # Today's snapshot (and any newly rebuilt manifest)
          [ -d public/data/snapshots ] && git add public/data/snapshots || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Daily refresh ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — fetching + rebasing onto fresh main..."
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed — aborting."; git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          echo "Push still failing after 4 attempts."
          exit 1
